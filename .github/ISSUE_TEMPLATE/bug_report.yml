name: Bug Report
description: Report a bug in AutoMD
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker
        - Local (pnpm dev)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AutoMD version
      placeholder: "0.1.0"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, browser info, etc.
