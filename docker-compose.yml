services:
  automd:
    image: ghcr.io/luka-zivkovic/automd:latest
    # build: .  # Uncomment to build from source instead of pulling
    ports:
      - "4800:4800"
    volumes:
      - automd_data:/data
    environment:
      - NODE_ENV=production
      - AUTOMD_PORT=4800
      - AUTOMD_STORAGE_DIR=/data
    restart: unless-stopped

volumes:
  automd_data:
